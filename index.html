<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw&Morph</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.8.0/gsap.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/MorphSVGPlugin3.min.js"></script>
</head>

<body>
    <div id="menu">
        <h1>Morphing Your Writing Goal!</h1>
        選擇參考字型
        <select id="fontSelector">
            <option value="BiauKai">標楷體(BiauKai)</option>
            <option value="LingWai">凌慧體(LingWai)</option>
        </select>
        <br>
        選擇書寫內容
        <select id="contentSelector">
            <option value="common4808">4808常用字</option>
            <option value="thousandWords">千字文</option>
        </select>
        <img src="./img/BiauKai.png" alt="BiauKai">
        <button id="ok">OK</button>
    </div>
    <div id="writingZone">
        <button id="setting">setting</button>
        <button id="hideGray">隱藏灰色字</button>
        <select id="guideSelector">
            <option value="four">四宮格</option>
            <option value="nine">九宮格</option>
            <option value="none">無</option>
        </select>
        <br>
        <input id="max" type="range" min="5" max="20" value="20" step="5">最粗筆畫
        <br>
        <input id="min" type="range" min="5" max="20" value="5" step="5">最細筆畫

        <div class="charSpace">
            <!-- 寫字的地方 -->
            <div class="stack">
                <!-- 畫布 -->
                <canvas id="drawingCanvas"></canvas>
                <!-- 參考線 -->
                <svg id="guideSvg" class="guideSvg" viewBox="0 0 100 100">
                    <!-- 四宮格 -->
                    <g id="four" transform="scale(0.1)" fill="#CCCCCC" stroke-width="10" stroke="#CCCCCC">
                        <line x1="500" y1="0" x2="500" y2="1000" />
                        <line x1="0" y1="500" x2="1000" y2="500" />
                    </g>
                    <!-- 九宮格 -->
                    <g id="nine" transform="scale(0.1)" fill="#CCCCCC" stroke-width="10" stroke="#CCCCCC">
                        <line x1="333" y1="0" x2="333" y2="1000" />
                        <line x1="666" y1="0" x2="666" y2="1000" />
                        <line x1="0" y1="333" x2="1000" y2="333" />
                        <line x1="0" y1="666" x2="1000" y2="666" />
                    </g>
                    <!-- 灰色字 -->
                    <g id="morphGray" transform="scale(0.1)" fill="#CCCCCC" stroke="#CCCCCC"></g>
                </svg>
            </div>

            <!-- morph結果 -->
            <svg class="morphSvg" viewBox="0 0 100 100">
                <g transform="scale(0.1)" id="morph" fill="#000" stroke="#000"></g>
            </svg>
        </div>

        <button id="exportBtn">Export SVG</button>
        <br>
        <input id="morphSlider" type="range" min="0" max="1" step="0.1" value="0" />
        <p id="morphValue">0</p>
    </div>

    <script src="./js/svg2Html.js"></script>
    <script src="./js/canvas2svg.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
